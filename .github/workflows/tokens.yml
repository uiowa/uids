name: Tokens

# Builds and validates the generated token Sass from src/tokens/**.

on:
  push:
    branches:
      - 4.x
      - 5.x
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      # Only node builtins, so this runs on a bare checkout and cannot fail for a
      # dependency reason.
      - name: Validate and generate the tokens
        run: node scripts/build-tokens.mjs

      - name: Enable corepack
        run: |
          corepack enable
          corepack prepare yarn@3.7.0 --activate
          yarn set version 3.7.0

      - run: yarn install --immutable

      - name: Compile the Sass
        run: yarn build

      - name: Test token generation
        run: yarn test:tokens

      - name: Verify packaged token entry points
        run: |
          npm pack --ignore-scripts
          tar -tzf uids-*.tgz | grep -Fx 'package/dist/tokens.css'
          tar -tzf uids-*.tgz | grep -Fx 'package/src/scss/abstracts/_tokens-generated.scss'
