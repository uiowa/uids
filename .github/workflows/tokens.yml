name: Tokens

# Fails when src/scss/abstracts/_tokens-generated.scss is out of date with src/tokens/**.

on:
  push:
    branches:
      - 4.x
      - 5.x
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Token drift
        run: node scripts/build-tokens.mjs --check
