<!--
  GAPS IN THE INFORMATION AVAILABLE — recorded rather than papered over.

  1. Card's dc-import prop names are not documented anywhere in my inputs.
     claude-design/readme.md gives an explicit prop list for Button, Form, Headline, CTA,
     Stat, Table, Alert, Badge, Banner, Callout, Blockquote, Menu, Tabs, Pager, Breadcrumbs
     and Accordion — but NOT for Card, which is the component the item-list-is-stacked-cards
     rule requires here. So for the five news items:
       - `borderless`, `link_text`, `url`  -> option names taken from catalog.json's
         contract options for `card`.
       - `title`, `meta`, `body`           -> taken from the readme's own description of
         Card's slots ("media, title, subtitle/meta, body, one button"). These are the
         readme's words for the slots, not a verified template prop list.
       - `{{ true }}`                      -> the boolean syntax the readme documents for
         other dc templates (Headline `underline`, Accordion `open`, Stat `stat_hover`).
     If any of these names is wrong the value fails SILENTLY (the readme records exactly
     that failure mode for Form's `control="text"`). Verify against Card.dc.html before use.

  2. Brand Footer's dc-import props are likewise undocumented (catalog lists the contract
     options `healthcare`, `parent_site_title`, `breakpoint`, none of which carry the site
     name). `siteName` below is used by analogy with Brand Bar, where the readme does
     document it. Same silent-failure risk.

  3. `link_indicator`, `orientation`, `headline_style` and the rest of Card's option axes
     exist in the catalog, but the catalog carries option NAMES without their allowed
     VALUES, so I have left them at their defaults rather than guess a value
     (components-from-catalog: never invent a value not listed in the contract).

  Everything else on this page — component choice, page order, tokens, heading structure —
  is fully determined by the four source files. News copy is placeholder content.
-->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News | College of Liberal Arts and Sciences</title>

  <!-- readme.md: link tokens.css in everything; layout.css and backgrounds.css after it.
       Do not repoint these paths — they resolve as siblings in this directory. -->
  <link rel="stylesheet" href="./tokens.css">
  <link rel="stylesheet" href="./layout.css">
  <link rel="stylesheet" href="./backgrounds.css">

  <script src="./support.js"></script>

  <style>
    /* Scoped to this page's own class on purpose. dc-import shares ONE document and ONE
       cascade with every component it pulls in, so a bare `main {}`, `h2 {}` or `a {}`
       here would reach inside each imported template and fight its rules at equal
       specificity. Only Page Scaffold.dc.html may declare bare element selectors.
       Every value below is a semantic-tier token (semantic-tier-first, tokens-only). */
    .uids-news-page {
      font-family: var(--uiowa-font-family-body);
      font-size: var(--uiowa-font-size-body);
      color: var(--uiowa-color-text);
      background-color: var(--uiowa-color-background);
    }
  </style>
</head>
<body>

  <!-- Page furniture: Brand Bar is the required page header. No second row here, so no
       narrow styling is forced (second-row-forces-narrow). -->
  <dc-import name="Brand Bar" siteName="College of Liberal Arts and Sciences"></dc-import>

  <main class="uids-news-page">

    <!-- page-title-under-brand-bar: breadcrumb + page title are ONE unit and sit directly
         under the Brand Bar, before any content section, both inside a page__container so
         they inherit the page gutters. The breadcrumb supplies the 1.75rem above the pair
         and the title sits flush beneath it, so no `page-title--no-breadcrumbs` here. -->
    <section class="layout__container">
      <div class="page__container">

        <dc-import
          name="Breadcrumbs"
          crumb_1_text="Home"
          crumb_1_url="/"
          current_page="News"></dc-import>

        <!-- Written as plain markup, NOT as a Headline import: `.page-title` in layout.css
             carries its own ramp (clamp(2.2rem, 3.3803vw + .9324rem, 3.7rem) at weight 600)
             and Headline's h1 stops at 3.35rem with weight 700. This is the second <h1> on
             the page — the Brand Bar's site name is the first. That pair is as-shipped and
             deliberate; page-heading-structure forbids "fixing" it by demoting this to h2. -->
        <h1 class="page-title headline headline--serif">News</h1>

      </div>
    </section>

    <!-- item-list-is-stacked-cards: a news listing is a stack of BORDERLESS Cards, one per
         row — not a hand-written <ul> with its own date/heading/summary CSS. Card already
         supplies the title, meta and body in the right proportions, so this section adds no
         styling of its own. A grid of BORDERED cards would be wrong here; that arrangement
         is for a set of parallel destinations. -->
    <section class="layout__container">
      <div class="page__container">

        <dc-import
          name="Card"
          borderless="{{ true }}"
          meta="August 20, 2026"
          title="Iowa researchers map how prairie soils lock away carbon"
          body="A five-year study of restored tallgrass plots in eastern Iowa found that root depth, not plant diversity, best predicted how much carbon a prairie held after a decade. The team is now working with county conservation boards to fold the finding into restoration planning."
          link_text="Read the full story"
          url="/news/prairie-soils-carbon"></dc-import>

        <dc-import
          name="Card"
          borderless="{{ true }}"
          meta="August 14, 2026"
          title="New writing fellowship brings six international authors to campus"
          body="The two-year residency pairs each fellow with an undergraduate workshop and a public reading series downtown. Applications drew submissions from forty-one countries in the program's first cycle."
          link_text="Read the full story"
          url="/news/international-writing-fellowship"></dc-import>

        <dc-import
          name="Card"
          borderless="{{ true }}"
          meta="August 6, 2026"
          title="Undergraduate lab uncovers a faster route to cleaner hydrogen"
          body="Working through the summer research program, four second-year chemistry students cut the energy cost of a catalytic step by roughly a third. Their result has been submitted for publication with all four listed as authors."
          link_text="Read the full story"
          url="/news/cleaner-hydrogen-catalyst"></dc-import>

        <dc-import
          name="Card"
          borderless="{{ true }}"
          meta="July 29, 2026"
          title="Class of 2030 arrives with the largest first-generation cohort on record"
          body="Nearly one in three incoming students is the first in their family to attend college. Advising and the peer mentor network have both expanded ahead of move-in week to meet the demand."
          link_text="Read the full story"
          url="/news/class-of-2030-first-generation"></dc-import>

        <dc-import
          name="Card"
          borderless="{{ true }}"
          meta="July 17, 2026"
          title="Alumni gift establishes scholarship for rural Iowa students"
          body="The endowment will fund twelve four-year awards each year, with preference for students from counties with no four-year institution. The first recipients will be named in the spring."
          link_text="Read the full story"
          url="/news/rural-iowa-scholarship"></dc-import>

      </div>
    </section>

  </main>

  <!-- Required page footer, pairing with the Brand Bar. -->
  <dc-import name="Brand Footer" siteName="College of Liberal Arts and Sciences"></dc-import>

</body>
</html>
