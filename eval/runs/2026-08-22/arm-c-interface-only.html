<!--
  GAPS AND ASSUMPTIONS — recorded rather than papered over.
  The only input to this build was claude-design/readme.md plus the task statement.

  1. THIS SHOULD BE `Page Scaffold.dc.html` WITH ITS BODY REPLACED, NOT A FRESH FILE.
     readme.md calls the scaffold "the canonical page structure; start here", and it is
     the ONE file allowed bare element selectors "because it supplies the page's
     baseline". I could not read it, so the skeleton below is reconstructed from the
     readme's "Essentials" and the scaffold's baseline element styles are NOT reproduced
     here. To ship: copy `Page Scaffold.dc.html` from the design system and paste the
     <body> content below into it, rather than using this file's own <head>.

  2. CARD'S ATTRIBUTE NAMES ARE INFERRED. readme.md names Card's slots in prose
     ("media, title, subtitle/meta, body, one button") but never gives the attribute
     names. `title`, `subtitle`, `body`, `button_label` and `button_url` below follow the
     snake_case convention of the components the readme does spell out (CTA:
     title/details/button_label; Banner: headline/pre_title/button_label; Callout:
     heading/body_text; Breadcrumbs: crumb_1_text/crumb_1_url). Check every one against
     contracts/card.json before this ships — in this view a wrong prop name fails
     SILENTLY. readme.md records exactly that failure for Form's control="text": the
     label renders and the control does not.

  3. NO ORIENTATION OR MEDIA AXIS IS SET. Card's orientation values are not documented in
     readme.md, so none is passed and every row renders stacked — which is what this
     listing wants ("stacked one per row", rule item-list-is-stacked-cards). If the
     production news row (thumbnail beside the text) is wanted instead, it needs the
     orientation prop AND the `.dc-card-column` wrapper that supplies Card's 400px
     container-query context; without that wrapper the left/right orientations silently
     render stacked anyway.

  4. NO IMAGES WERE SUPPLIED. readme.md says an empty `image` falls back to a grey
     placeholder, so each of the five rows shows that placeholder until real URLs are
     passed. Nothing was invented to fill the slot.

  5. ONE FILE WAS REQUESTED, BUT `dc-import` RESOLVES SIBLINGS ONLY, and a missing
     sibling renders NOTHING with no error. Before this page renders, copy_files from
     design system a371c390-7071-4ac7-a122-87440610e63a into this file's directory:
       Page Scaffold.dc.html, Brand Bar.dc.html, Brand Footer.dc.html, Logo.dc.html,
       Breadcrumbs.dc.html, Card.dc.html, Headline.dc.html, Button.dc.html,
       tokens.css, layout.css, backgrounds.css
     then run create_support_js in that same directory. (Logo because Brand Bar and Brand
     Footer both import it; Headline and Button because Card imports both.) The three
     stylesheets are linked, not inlined, on purpose: readme.md forbids hand-authoring or
     extending tokens.css, so this page is not literally self-contained and cannot be.

  6. CONTENT IS PLACEHOLDER. No site, section, or story URLs were given, so the site
     name, the breadcrumb trail, the five stories and every href are stand-ins.

  7. TWO <h1> ELEMENTS (the Brand Bar's site name and the page title) is as-shipped UIDS
     and is left alone deliberately — demoting the page title to h2 would lose the
     .page-title type ramp.
-->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News | College of Engineering</title>

  <!-- tokens.css first, then layout.css and backgrounds.css. Generated files: never
       hand-edited, never extended, never repointed. -->
  <link rel="stylesheet" href="./tokens.css">
  <link rel="stylesheet" href="./layout.css">
  <link rel="stylesheet" href="./backgrounds.css">

  <!-- No page-level <style> block. dc-import shares one document and one cascade with
       every component it pulls in, so a bare h2/p/a rule written here would reach inside
       the imported templates and fight them at equal specificity. Every class used below
       comes from layout.css or the design system. -->
</head>
<body>

  <dc-import name="Brand Bar" siteName="College of Engineering"></dc-import>

  <!-- Breadcrumbs and the page title are ONE unit, directly under the Brand Bar and
       before any content section, both inside page__container. The breadcrumb supplies
       the 1.75rem above the pair and the title sits flush beneath it, so
       page-title--no-breadcrumbs is deliberately NOT used here. -->
  <section class="layout__container">
    <div class="page__container">
      <dc-import
        name="Breadcrumbs"
        crumb_1_text="Home"
        crumb_1_url="#"
        current_page="News"></dc-import>

      <h1 class="page-title headline headline--serif">News</h1>
    </div>
  </section>

  <!-- The listing. A news listing is stacked BORDERLESS cards, one per row — not a
       hand-written <ul> with its own date/heading/summary CSS. Card already supplies the
       title, the date line, the summary and the link in the right proportions, so there
       is no custom markup or custom CSS in this section at all. Same page__container as
       the title above, so the listing's left edge aligns with the h1. -->
  <section class="layout__container">
    <div class="page__container">

      <dc-import
        name="Card"
        borderless="{{ true }}"
        subtitle="August 18, 2026"
        title="Low-cost flood sensors go live on 40 eastern Iowa streams"
        body="A sensor network designed and built on campus now reports stream levels every fifteen minutes, giving small towns the same early warning that larger cities have had for a decade."
        button_label="Read the full story"
        button_url="#"></dc-import>

      <dc-import
        name="Card"
        borderless="{{ true }}"
        subtitle="August 12, 2026"
        title="Summer tuition grant closes the gap for transfer students"
        body="Starting next term, students transferring from Iowa community colleges can apply a new grant to summer credit hours — the term where transfer plans most often stall."
        button_label="Read the full story"
        button_url="#"></dc-import>

      <dc-import
        name="Card"
        borderless="{{ true }}"
        subtitle="August 5, 2026"
        title="Student robotics team finishes second at national competition"
        body="The team's autonomous rover completed all six field tasks without operator input, a first for the program, and placed second in a field of seventy-four entries."
        button_label="Read the full story"
        button_url="#"></dc-import>

      <dc-import
        name="Card"
        borderless="{{ true }}"
        subtitle="July 29, 2026"
        title="Study ties upstream soil practices to downstream water quality"
        body="Four years of field data from twelve Iowa watersheds suggest that cover-crop adoption explains more of the variation in nitrate loading than rainfall does."
        button_label="Read the full story"
        button_url="#"></dc-import>

      <dc-import
        name="Card"
        borderless="{{ true }}"
        subtitle="July 21, 2026"
        title="Rebuilt fabrication studio opens to students this fall"
        body="The renovated shop adds three work bays, a dedicated composites room, and evening hours staffed by trained student technicians."
        button_label="Read the full story"
        button_url="#"></dc-import>

    </div>
  </section>

  <dc-import name="Brand Footer"></dc-import>

</body>
</html>
