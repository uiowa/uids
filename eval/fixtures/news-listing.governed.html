<!-- Representative GOVERNED output: the same prompt, with the catalog, rules and readme
     supplied. Uses only catalog components, options and legal values; the list is stacked
     borderless Cards per item-list-is-stacked-cards; page styles are scoped to own classes. -->
<!DOCTYPE html>
<html>
  <head>
    <style>
      html { box-sizing: border-box }
      *, *::before, *::after { box-sizing: inherit }
      body { margin: 0 }
      .news-listing__item { margin-bottom: var(--uiowa-space-150) }
    </style>
  </head>
  <body>
    <dc-import name="Brand Bar" siteName="College of Engineering" narrow="{{ true }}" second_row_content="Research"></dc-import>
    <dc-import name="Breadcrumbs" crumb_1_text="Home" crumb_1_url="/"></dc-import>
    <!-- readme.md: the page title is PLAIN MARKUP, not a Headline or Page Title import. -->
    <h1 class="page-title headline headline--serif">News</h1>

    <div class="news-listing">
      <div class="news-listing__item">
        <dc-import name="Card" borderless="{{ true }}" orientation="left"
                   meta="March 4, 2026" title="Engineering team wins national award"
                   link_text="Read more" url="/news/1"></dc-import>
      </div>
      <div class="news-listing__item">
        <dc-import name="Card" borderless="{{ true }}" orientation="left"
                   meta="March 1, 2026" title="New lab opens on the west campus"
                   link_text="Read more" url="/news/2"></dc-import>
      </div>
    </div>

    <dc-import name="Brand Footer" siteName="College of Engineering"></dc-import>
  </body>
</html>
