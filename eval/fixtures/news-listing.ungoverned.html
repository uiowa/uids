<!-- Representative UNGOVERNED output: what the same model produces from the prompt alone.
     Hand-written from the failure modes this repo has actually observed — a hand-rolled
     list instead of borderless Cards, invented props, raw hex, ad-hoc type, bare selectors. -->
<!DOCTYPE html>
<html>
  <head>
    <style>
      body { margin: 0; font-family: Roboto, sans-serif; }
      h2 { font-size: 27px; color: #1a1a1a; margin-bottom: 8px; }
      a { color: #0055a0; }
      .news-item { border-bottom: 1px solid #dddddd; padding: 18px 0; }
      .news-date { font-size: 13px; color: #767676; text-transform: uppercase; }
      .news-summary { font-size: 17px; line-height: 1.6; color: #333333; }
      .news-badge { position: absolute; top: 12px; right: 12px; background: #ffcd00; }
    </style>
  </head>
  <body>
    <dc-import name="Brand Bar" siteName="College of Engineering" second_row_content="Research"></dc-import>
    <dc-import name="Breadcrumbs" crumb_1_text="Home" crumb_1_url="/"></dc-import>
    <dc-import name="Page Title" title="News" subtitle="Latest from the college"></dc-import>

    <ul class="news-list">
      <li class="news-item">
        <div class="news-date">March 4, 2026</div>
        <h2>Engineering team wins national award</h2>
        <p class="news-summary">A cross-disciplinary team took first place at the national finals.</p>
        <span class="news-badge">New</span>
        <a href="/news/1">Read more</a>
      </li>
      <li class="news-item">
        <div class="news-date">March 1, 2026</div>
        <h2>New lab opens on the west campus</h2>
        <p class="news-summary">The facility adds 12,000 square feet of research space.</p>
        <a href="/news/2">Read more</a>
      </li>
    </ul>

    <dc-import name="NewsCard" headline="Featured" theme="purple"></dc-import>
    <dc-import name="Brand Footer" siteName="College of Engineering"></dc-import>
  </body>
</html>
