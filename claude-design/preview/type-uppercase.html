<!doctype html>
<!-- @dsCard group="Brand" name="Type — Uppercase (Antonio)" subtitle="Caps display family + owner-ruled weight" viewport="640x210" -->
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../tokens.css" />
    <style>
  html{box-sizing:border-box}
  *,*::before,*::after{box-sizing:inherit}
  body{margin:0;padding:28px;font-family:system-ui,sans-serif;color:#111;background:#fff}
  h1.card-title{font-size:1.05rem;font-weight:700;margin:0 0 1.35rem;padding-bottom:.5rem;border-bottom:3px solid #FFCD00;text-transform:uppercase;letter-spacing:.02em;}
  section.group{margin-bottom:2rem;}
  section.group:last-child{margin-bottom:0;}
  h2.group-title{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:#555;margin:0 0 .85rem;}
  dl.meta{display:flex;flex-wrap:wrap;gap:.25rem 1.5rem;margin:.6rem 0 0;font-size:.78rem;color:#444;}
  dl.meta div{display:flex;gap:.35rem;}
  dl.meta dt{font-weight:700;color:#111;}
  dl.meta dd{margin:0;}
</style>
  </head>
  <body>
    <h1 class="card-title">Type — Uppercase (Antonio)</h1>
    <section class="group"><div style="text-transform:uppercase;font-family:var(--uiowa-font-family-caps);font-weight:var(--uiowa-font-weight-light);font-size:var(--uiowa-font-size-400);letter-spacing:0;-webkit-font-smoothing:auto;">Uppercase display</div><dl class="meta">
    <div><dt>Family</dt><dd>Antonio</dd></div>
    <div><dt>Weight</dt><dd>300 (uppercase display role; the Headline component's own uppercase treatment declares 700 &mdash; contracts/headline.json)</dd></div>
  </dl></section>
  </body>
</html>
