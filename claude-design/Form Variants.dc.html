<!DOCTYPE html>
<!-- @dsCard group="Actions" name="Form" subtitle="Text, select, checkbox, radio, toggle, and file fields" viewport="720x500" -->
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet data-dc-atomics>
        <link rel="stylesheet" href="./tokens.css" />
        <style>
          html{box-sizing:border-box}
          *,*::before,*::after{box-sizing:inherit}
          body{margin:0;padding:24px;font-family:var(--uiowa-font-family-body);background:#fff}
          .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
        </style>
      </helmet>
      <div class="grid">
        <dc-import name="Form" control="input" label="Text Input" hint-size="200px,70px"></dc-import>
        <dc-import name="Form" control="textarea" label="Text Area" value="" hint-size="200px,122px"></dc-import>
        <dc-import name="Form" control="select" label="Select" hint-size="200px,70px"></dc-import>
        <dc-import name="Form" control="select-multiple" label="Select (Multiple)" hint-size="200px,182px"></dc-import>
        <dc-import name="Form" control="file" label="File Upload" hint-size="200px,80px"></dc-import>
        <dc-import name="Form" control="checkbox" label="Checkbox" hint-size="200px,30px"></dc-import>
        <dc-import name="Form" control="radio" label="Radio" hint-size="200px,30px"></dc-import>
        <dc-import name="Form" control="toggle" label="Toggle" hint-size="200px,60px"></dc-import>
      </div>
    </x-dc>
  </body>
</html>
