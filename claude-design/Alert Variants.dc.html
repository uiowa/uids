<!DOCTYPE html>
<!-- @dsCard group="Content" name="Alert" subtitle="Inline message; four severity levels" viewport="700x580" -->
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet data-dc-atomics>
        <link rel="stylesheet" href="./tokens.css" />
        <style>
          html{box-sizing:border-box}
          *,*::before,*::after{box-sizing:inherit}
          body{margin:0;padding:24px;font-family:var(--uiowa-font-family-body);background:#fff}
          .alert-stack{display:flex;flex-direction:column;gap:12px}
        </style>
      </helmet>
      <div class="alert-stack">
        <dc-import name="Alert" type="info" heading="Registration Opens March 15" body="Priority registration begins for continuing students. Check MyUI for your time." hint-size="650px,130px"></dc-import>
        <dc-import name="Alert" type="success" heading="Profile Updated" body="Your changes have been saved successfully." hint-size="650px,120px"></dc-import>
        <dc-import name="Alert" type="warning" heading="Password Expiring Soon" body="Your password expires in 3 days &mdash; update it to keep access." hint-size="650px,120px"></dc-import>
        <dc-import name="Alert" type="danger" heading="Submission Failed" body="We couldn't process your request. Please try again." hint-size="650px,120px"></dc-import>
      </div>
    </x-dc>
  </body>
</html>
