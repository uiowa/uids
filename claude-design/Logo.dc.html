<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet data-dc-atomics>
        <link rel="stylesheet" href="./tokens.css" />
        <style>
          body{margin:0}
          .logo{display:block}
          /* display is deliberately NOT set on the anchor or the svg, and the tab is NOT a
             flex container. logo.scss sets no display at all, and production leaves both the
             <a> and the <svg> INLINE — measured on the Iowa story at 375/980/1350:
             .logo--tab display=block align-items=normal, .logo a display=inline,
             .logo-icon display=inline. An earlier version of this file added
             display:flex + align-items:center here and display:block on both children, which
             centred the icon (~0.5px each side) where production's baseline alignment gives
             an asymmetric ~27px-top/20px-bottom gap around the 43px icon — a 3-4px vertical
             shift. It arguably looked BETTER, which is exactly why it needed removing:
             the view represents as-shipped, it does not quietly improve.
             box-sizing:border-box stays — logo.scss does not declare it either, but
             production gets it globally from base/_reset.scss:32-53 and the tab's
             token height/width are authored against it (measured border-box in production). */
          .logo a{text-decoration:none}
          .logo--tab{height:var(--uiowa-logo-tab-height-default);width:var(--uiowa-logo-tab-width-default);padding:25px 20px;background:var(--uiowa-logo-tab-background);box-sizing:border-box}
          .logo--tab.logo--healthcare{height:var(--uiowa-logo-tab-height-healthcare);padding:20px}
          .logo--footer{width:var(--uiowa-logo-footer-width);padding:0 40px 0 0;box-sizing:border-box}
          .logo-icon{fill:var(--uiowa-logo-fill);height:var(--uiowa-logo-icon-height-default);width:auto}
          .logo--healthcare .logo-icon{height:var(--uiowa-logo-icon-height-healthcare)}
          .logo-icon .logo-text{fill:var(--uiowa-logo-text-fill)}

          /* Interactive states, from logo.scss:20-22 and :43-46. These were MISSING — the
             template had no :hover/:focus rule at all, so the tab and icon gave no
             feedback. The height/width/background tokens switch themselves across
             breakpoints, which is why the omission below hid for so long, but PADDING is
             untokenized literal geometry (contracts/logo.json geometryNotTokenized) and so
             has to be reproduced by hand. */
          .logo--tab a:focus svg{opacity:.5}
          .logo-icon:hover,.logo-icon:focus{opacity:.7}

          /* Responsive tab padding, from logo.scss:24-30 and :55-57. Also MISSING: the
             template declared only the mobile value and froze there, so every viewport
             >=980px rendered the wrong padding — which is two of the three regression
             verification widths (375/980/1350). $gutter is 1.25rem = 20px
             (_variables.scss:83), $break-md = 980px, $break-page-container = 84.375em =
             1350px (:95,:97).
             Inside Brand Bar the >=1350px value is further overridden to 27px 20px 20px by
             brand-bar.scss:93-97 (higher specificity, .iowa-bar .logo--tab) — that belongs
             to Brand Bar.dc.html, not here; standalone Logo uses logo.scss's own 23px 20px. */
          @media (min-width:980px){
            .logo--tab{padding:25px}
            .logo--tab.logo--healthcare{padding:23px 22px}
          }
          @media (min-width:1350px){
            .logo--tab{padding:23px 20px}
          }
        </style>
      </helmet>
      <div class="{{ rootClass }}">
        <a href="{{ link }}" aria-label="{{ ariaLabel }}">
          <sc-if value="{{ isIowa }}" hint-placeholder-val="{{ true }}">
            <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 311.6 90.2" role="img">

              <path d="M93.8 90.2h-29c-10.5 0-17.4-6.9-17.4-18.2V18.2C47.4 7 54.4 0 64.8 0h29c10.5 0 17.4 7 17.4 18.2V72C111.2 83.2 104.2 90.2 93.8 90.2zM85.6 71.2V18.8H73v52.4H85.6z"></path>
              <path d="M122.6 18.8h-6.4V0h38v18.9H147l6.5 43.4L167 0h19.2l14.4 62.3 5.2-43.4h-6.6V0h37.5v18.9h-6.2l-11.3 71.4h-30.6l-11.8-53.2 -12.1 53.1h-29.4L122.6 18.8z"></path>

              <path d="M43.91 33.67h-3.46v24.89h3.46v9.02H24.89v-9.02h3.46V33.67h-3.46v-8.96h19.02zm25.56 33.91H55.7c-5 0-8.28-3.27-8.28-8.65V33.37c0-5.31 3.33-8.65 8.28-8.65h13.77c5 0 8.28 3.34 8.28 8.65v25.57c-.01 5.3-3.34 8.64-8.28 8.64m-3.89-9.02V33.67h-5.99v24.89zm17.57-24.89h-3.03v-8.96h18.03v8.96h-3.4l3.09 20.63 6.42-29.58h9.14l6.85 29.58 2.47-20.63h-3.15v-8.96h17.79v8.96h-2.96l-5.37 33.91h-14.51l-5.62-25.26-5.74 25.26H89.21zm51.08 24.89h3.27l6.48-33.84h19.45l6.42 33.84h3.03v9.02h-14.51l-1.36-10.44h-7.23l-1.3 10.44h-14.27v-9.02zm22.05-9.26-2.78-17.29-2.84 17.29z"></path>
              <path class="logo-text" d="M62.99 75.75h-3.42L53.4 92.32h4.08l1.01-3.03h5.6l1.02 3.03h4.08l-6.14-16.39zm.04 10.34h-3.49l1.74-5.45z"></path>
            </svg>
          </sc-if>
        </a>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{
  "$preview": { "width": 260, "height": 140 },
  "lockup": { "editor": "enum", "options": ["iowa", "healthcare"], "default": "iowa", "tsType": "string" },
  "context": { "editor": "enum", "options": ["header", "footer"], "default": "header", "tsType": "string" }
}'
    >
      class Component extends DCLogic {
        renderVals() {
          const lockup = this.props.lockup ?? 'iowa';
          const context = this.props.context ?? 'header';
          const hc = lockup === 'healthcare';
          return {
            rootClass: 'logo ' + (context === 'footer' ? 'logo--footer' : 'logo--tab') + (hc ? ' logo--healthcare' : ''),
            link: hc ? 'https://uihealthcare.org' : 'https://uiowa.edu',
            ariaLabel: hc ? 'The University of Iowa Health Care' : 'University of Iowa',
            isHealthcare: hc,
            isIowa: !hc
          };
        }
      }
    </script>
  </body>
</html>
