<!DOCTYPE html>
<!-- @dsCard group="Page furniture" name="Logo" subtitle="Block IOWA and IOWA Health Care lockups" viewport="440x170" -->
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet data-dc-atomics>
        <link rel="stylesheet" href="./tokens.css" />
        <style>
          html{box-sizing:border-box}
          *,*::before,*::after{box-sizing:inherit}
          body{margin:0;padding:24px;font-family:var(--uiowa-font-family-body);background:#fff}
          .logo-row{display:flex;flex-wrap:wrap;gap:32px;align-items:center}
        </style>
      </helmet>
      <div class="logo-row">
        <dc-import name="Logo" lockup="iowa" context="header" hint-size="154px,80px"></dc-import>
        <dc-import name="Logo" lockup="healthcare" context="header" hint-size="154px,80px"></dc-import>
      </div>
    </x-dc>
  </body>
</html>
