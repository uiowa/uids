<!DOCTYPE html>
<!-- @dsCard group="Content" name="Badge" subtitle="Status pill; six color modifiers" viewport="620x140" -->
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet data-dc-atomics>
        <link rel="stylesheet" href="./tokens.css" />
        <style>
          html{box-sizing:border-box}
          *,*::before,*::after{box-sizing:inherit}
          body{
            margin:0;
            padding:24px;
            font-family:var(--uiowa-font-family-body);
          }
          .badge-row{
            display:flex;
            flex-wrap:wrap;
            gap:10px;
            align-items:center;
          }
        </style>
      </helmet>
      <div class="badge-row">
        <dc-import name="Badge" type="primary" text="New" hint-size="60px,26px"></dc-import>
        <dc-import name="Badge" type="secondary" text="Draft" hint-size="65px,26px"></dc-import>
        <dc-import name="Badge" type="cool-gray" text="Archived" hint-size="90px,26px"></dc-import>
        <dc-import name="Badge" type="blue" text="Info" hint-size="55px,26px"></dc-import>
        <dc-import name="Badge" type="green" text="Approved" hint-size="90px,26px"></dc-import>
        <dc-import name="Badge" type="orange" text="Overdue" hint-size="85px,26px"></dc-import>
      </div>
    </x-dc>
  </body>
</html>
