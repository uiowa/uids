<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./support.js"></script>
  </head>
  <body>
    <!--
      UIDS page scaffold — the canonical structure of a University of Iowa page.
      Copy this file (plus its siblings, see "Using these components" in the guide) into
      your project and replace the content. Keep the structure: Brand Bar, then
      .layout__container sections each wrapping a .page__container, then Brand Footer.
    -->
    <x-dc>
      <helmet data-dc-atomics>
        <link rel="stylesheet" href="./tokens.css" />
        <link rel="stylesheet" href="./layout.css" />
        <!-- REQUIRED, not optional: this scaffold uses bg--* bands below, and the whole
             bg--* grammar (fill + the on-light/on-dark text cascade) lives in
             backgrounds.css. Without this link the "Highlighted band" section rendered
             WHITE and the merge behaviour it exists to demonstrate was invisible —
             silently, since a missing background class is not an error. Added 2026-08-17. -->
        <link rel="stylesheet" href="./backgrounds.css" />
        <style>
          body{margin:0;font-family:var(--uiowa-font-family-body);color:var(--uiowa-color-text);background:var(--uiowa-color-background)}
          a{color:var(--uiowa-color-link)}
          a:hover{text-decoration:underline}
          h2{font-size:var(--uiowa-font-size-heading-h2);font-weight:var(--uiowa-font-weight-heading);font-family:var(--uiowa-font-family-heading);line-height:var(--uiowa-line-height-125);margin:0 0 var(--uiowa-space-125)}
          h3{font-size:var(--uiowa-font-size-heading-h3);font-weight:var(--uiowa-font-weight-heading);font-family:var(--uiowa-font-family-heading);line-height:var(--uiowa-line-height-125);margin:0 0 var(--uiowa-space-100)}
          p{font-size:var(--uiowa-font-size-body);line-height:var(--uiowa-line-height-170);margin:0 0 var(--uiowa-space-125)}
          p:last-child{margin-bottom:0}
          .intro{font-size:var(--uiowa-font-size-intro-light);font-weight:var(--uiowa-font-weight-light);line-height:var(--uiowa-line-height-140)}
          /* Placeholder for components this design system has NOT migrated yet.
             Use it instead of improvising an Iowa-looking card/alert. Buttons ARE
             migrated — import Button rather than placeholdering or hand-rolling one. */
          .uids-placeholder{border:1px dashed var(--uiowa-color-gray-300);padding:var(--uiowa-space-200);font-family:monospace;font-size:var(--uiowa-font-size-base);color:var(--uiowa-color-gray-500)}
        </style>
      </helmet>

      <!-- Required header. Props: narrow, healthcare, showSiteName/siteName,
           showParentTitle/parentTitle, showSecondRow/secondRowTitle. -->
      <dc-import name="Brand Bar" siteName="Site Name" hint-size="100%,80px"></dc-import>

      <!-- Required primary navigation. contracts/rules.json top-nav-on-every-page: every
           page gets the Brand Bar as its header PLUS a horizontal Menu across the top,
           with a vertical Menu reserved for sidebar or section nav.
           ADDED 2026-08-25. The rule was minted in 292d02e632; this scaffold had not
           changed since f77d7d2f43 and so predated it, which meant the canonical page
           structure contradicted the rule it is supposed to illustrate. That is not
           hypothetical: a landing page built from this file shipped with no top nav at
           all and no checker or report caught it, because the page satisfied every
           component it was asked for.
           NO outer <nav> wrapper on purpose — Menu renders its own
           <nav aria-label="{{ label }}"> (Menu.dc.html:220, the Menu.vue:49 top=true
           branch), so wrapping it nests a second navigation landmark. Pass `label`.
           Two limits the rule names, both as-shipped: the horizontal variant is
           CONTAINER-gated at 768px, so a narrower container renders it stacked and says
           nothing, and there are NO dropdowns. -->
      <div class="page__container">
        <dc-import name="Menu" variant="horizontal" label="Primary navigation" item_1="About" item_2="Academics" child_1="Undergraduate" child_2="Graduate" child_3="Research" item_3="Admissions" item_4="News &amp; Events" active_item="top_1" hint-size="100%,60px"></dc-import>
      </div>

      <!-- THE SECTIONS GO IN A WRAPPER OF THEIR OWN, and it is load-bearing, not tidiness.
           layout.css zeroes the top padding of `.layout__container:first-child`, which is
           how production starts a page flush under the navigation. Production satisfies it
           structurally: every section lives in <div class="node__content">, which holds
           sections and nothing else, while the Brand Bar and the nav sit in a different
           Drupal region entirely. Leave the sections as siblings of the Brand Bar and the
           nav strip — as this scaffold did until 2026-08-25 — and :first-child never
           matches, so the title section adds 48px above the breadcrumb that a real page
           does not have. MEASURED on https://sandbox.prod.drupal.uiowa.edu/test-directory:
           28px between the nav and the breadcrumb, all of it the breadcrumb's own
           margin-top (1.75rem, src/scss/components/breadcrumbs.scss:63-64), and the title
           section computing padding-top 0. The parity rebuild measured 77px before this
           wrapper and 28px after. <main> also gives the page the landmark it was missing. -->
      <main>

      <!-- THE TITLE SECTION. contracts/rules.json page-title-is-its-own-section: the page
           title and the breadcrumb get a layout__container to THEMSELVES, carrying
           layout--title, and content starts a new section below.
           ADDED 2026-08-25 alongside the rule. This scaffold used to pack the title, a
           section heading, intro copy and a Button into one plain layout__container with no
           layout--title — the same shape of bug the top-nav fix found earlier that day,
           where the canonical structure contradicted a rule it is supposed to illustrate.
           The class buys the spacing as a PAIR, and both halves are in layout.css so both
           show up in the preview: layout--title drops THIS section's padding-bottom to
           1.25rem, and the section that follows has its padding-top zeroed. Downstream,
           uids_base DETECTS the class from the page-title block rather than taking it from
           you (uids_base.theme:797) — giving the title a section of its own is what makes
           it land on the right box. -->
      <section class="layout__container layout--title" data-screen-label="Page title">
        <div class="page__container">
          <!-- column-container on EVERY region, per contracts/rules.json
               column-container-around-components. It is what establishes
               `@container column`, which is how Menu, Card orientation and Banner's width
               cap decide their layout — they read the width of THIS box, not the viewport,
               and without it they silently render their fallback. Production puts the class
               on every Layout Builder region, so it is here on every section even where the
               contents do not need it yet: the shape is what gets copied. -->
          <div class="column-container">
          <!-- Breadcrumbs and the title are ONE unit (page-title-under-brand-bar): the
               breadcrumb's 1.75rem top margin supplies the space above and the title sits
               flush beneath it. Leave a crumb's text empty to drop it. -->
          <dc-import name="Breadcrumbs" crumb_1_text="Home" crumb_1_url="https://uiowa.edu" crumb_2_text="Section" crumb_2_url="#" crumb_3_text="" crumb_3_url="" current_page="Page title" hint-size="100%,50px"></dc-import>
          <!-- THE PAGE TITLE. Plain markup, not a Headline import: `.page-title` (in
               layout.css) is the STANDARD h1 ramp at weight 600 —
               --uiowa-page-title-font-size resolves through --uiowa-font-size-heading-h1
               to clamp(2.3rem, calc(2.3662vw + 1.4127rem), 3.35rem). The SIZE matches
               Headline's h1 exactly; the WEIGHT does not — `headline--serif` alone gives
               700 — and that is the only property distinguishing the two.
               CORRECTED 2026-08-22: this comment attributed a clamp(2.2rem … 3.7rem)
               ramp to .page-title and argued from size. That clamp is real but scoped to
               BANNER layouts — uids_base scss/components/banner.scss:22, under
               `.layout--title.banner .headline.page-title` — which an ordinary page title
               never matches. layout.css recorded the correction 2026-08-17 and readme.md
               2026-08-22; this copy was missed. No rendered value changes.
               `.page-title` is a UIDS component as of 2026-08-17; it began as a uids_base
               treatment. Note this is the page's SECOND h1: the Brand Bar's site name is
               also an h1, as-shipped. -->
          <h1 class="page-title headline headline--serif">Page title</h1>
          </div>
        </div>
      </section>

      <!-- CONTENT STARTS A NEW SECTION. Nothing but the breadcrumb and the h1 may share the
           title section — page-title-is-its-own-section. This section's padding-top is
           already 0 (the title section above zeroed it), so the 1.25rem under the title is
           the whole gap, exactly as production measures it. -->
      <section class="layout__container" data-screen-label="Intro">
        <div class="page__container">
          <div class="column-container">
            <h2>Section heading</h2>
            <p class="intro">Intro copy sets up the page in one or two sentences.</p>
            <!-- Needs Button.dc.html copied in as a sibling. Colors primary|secondary|
                 tertiary; sizes small|medium|large. -->
            <dc-import name="Button" label="Read more" color="primary" size="medium"></dc-import>
          </div>
        </div>
      </section>

      <!-- Background band. Adjacent sections sharing a .bg--* class merge into one band
           (the second drops its top padding) — that is intended, not a bug. -->
      <section class="layout__container bg--gray" data-screen-label="Highlight">
        <div class="page__container">
          <div class="column-container">
            <h2>Highlighted band</h2>
            <p>Use .bg--gold, .bg--black, or .bg--gray for a full-width band.</p>
          </div>
        </div>
      </section>

      <!-- A content grid takes the STANDARD container, not the narrow one —
           container-width-by-content. Narrow caps the measure at 1020px, which is right for
           a single block of copy or a CTA and wrong for columns: measured at 1440px a
           three-across grid gives 405px columns standard against 308px narrow, and at 308px
           a card title wraps to three lines. Grid options: grid--twocol--50-50,
           grid--threecol--33-34-33, grid--fourcol--25, grid--twocol--25-75.
           This section stays WHITE: the Highlight band above it is gray, and
           alternate-section-backgrounds says not to put two coloured bands next to each
           other — the white between them is what makes each read as a band. The scaffold's
           sequence is white, white, gray, white. -->
      <section class="layout__container" data-screen-label="Grid">
        <div class="page__container">
          <div class="column-container">
            <h2>Repeated content</h2>
            <!-- The grid itself needs no column-container: GridItem's .grid__column around
                 each item is already a host, which is why a card in a grid gets its
                 orientation and its 400px switch for free. -->
            <div class="list-container list-container--grid grid--threecol--33-34-33">
              <div class="list-container__inner">
                <div class="uids-placeholder">card component not migrated</div>
                <div class="uids-placeholder">card component not migrated</div>
                <div class="uids-placeholder">card component not migrated</div>
              </div>
            </div>
          </div>
        </div>
      </section>

      </main>

      <!-- Required footer. Props: healthcare, showSiteName/siteName,
           showParentTitle/parentTitle, showContact/contact/phone/email. -->
      <dc-import name="Brand Footer" siteName="Site Name" hint-size="100%,300px"></dc-import>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{}'
    >
      class Component extends DCLogic {
        renderVals() { return {}; }
      }
    </script>
  </body>
</html>
