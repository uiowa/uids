<!DOCTYPE html>
<!-- @dsCard group="Actions" name="Button" subtitle="Primary, secondary, and tertiary styles" viewport="560x110" -->
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet data-dc-atomics>
        <link rel="stylesheet" href="./tokens.css" />
        <style>
          html{box-sizing:border-box}
          *,*::before,*::after{box-sizing:inherit}
          body{margin:0;padding:24px;font-family:var(--uiowa-font-family-body);background:#fff}
          .row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
        </style>
      </helmet>
      <div class="row">
        <dc-import name="Button" label="Primary" url="#" color="primary" size="medium" hint-size="140px,48px"></dc-import>
        <dc-import name="Button" label="Secondary" url="#" color="secondary" size="medium" hint-size="140px,48px"></dc-import>
        <dc-import name="Button" label="Tertiary" url="#" color="tertiary" size="medium" hint-size="140px,48px"></dc-import>
      </div>
    </x-dc>
  </body>
</html>
