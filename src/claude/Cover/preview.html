<!-- @dsCard height=288 -->
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400&family=Zilla+Slab:wght@600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--uiowa-color-background-default); }
  .cover svg { position: absolute; inset: 0; }
  .gold { fill: var(--uiowa-color-brand-gold); }
  .black { fill: var(--uiowa-color-brand-black); }
  .gray { fill: var(--uiowa-color-background-gray); }
  .rule { stroke: var(--uiowa-color-brand-black); stroke-width: var(--uiowa-stroke-width-8); }
  .name { position: absolute; left: 48px; bottom: 32px; max-width: 440px; }
  .name h1 { margin: 0; font: 600 120px/0.92 var(--uiowa-typography-font-family-zilla-slab); color: var(--uiowa-color-text-default); }
  .name p { margin: 8px 0 0; font: 400 14px/1.4 var(--uiowa-typography-font-family-roboto); color: var(--uiowa-color-neutral-500); }
</style>
<div class="cover">
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
    <!--
      Blocks: brand-gold 192x288 slab, brand-black 160x176, background-gray 128x128 (space-800).
      Arrangement: one tall gold slab bleeding top and bottom, black bleeding off the top-right corner, gray tucked at the lower left.
      Pattern: stripes, from "the heavy accent rule" (stroke-width-8) on the loud black-and-gold palette.
      Steps: space-200 (32px) stripe pitch.
    -->
    <rect class="gray" x="480" y="160" width="128" height="128"/>
    <rect class="gold" x="608" y="0" width="192" height="288"/>
    <rect class="black" x="800" y="0" width="160" height="176"/>
    <line class="rule" x1="608" y1="192" x2="800" y2="192"/>
    <line class="rule" x1="608" y1="224" x2="800" y2="224"/>
    <line class="rule" x1="608" y1="256" x2="800" y2="256"/>
  </svg>
  <div class="name">
    <h1>UIDS</h1>
    <p>The University of Iowa Design System.</p>
  </div>
</div>
